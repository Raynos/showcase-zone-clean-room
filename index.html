<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#14171c" />
    <title>CRATEFALL — The Proving Yard</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14171c; overflow: hidden; overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 100;
        background: radial-gradient(120% 80% at 50% 60%, #3a2a1c 0%, #14171c 70%); color: #ffd9a8;
        font: 600 13px/1.4 "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; letter-spacing: .32em; transition: opacity .6s; }
      #boot .t { font-size: 40px; font-weight: 800; letter-spacing: .12em; color: #ff9a3c; text-shadow: 0 0 28px #ff7a1a88; }
      #boot .bar { width: 180px; height: 3px; background: #ffffff18; margin: 18px auto 10px; overflow: hidden; border-radius: 2px; }
      #boot .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #ff9a3c, #5ef0ff); transition: width .25s; }
      #boot .c { text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <div id="boot"><div class="c"><div class="t">CRATEFALL</div><div class="bar"><i id="bootbar"></i></div><div id="boottext">WAKING THE YARD</div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
