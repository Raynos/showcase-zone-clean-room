<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#14171c" />
    <title>CRATEFALL — The Proving Yard</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14171c; overflow: hidden; overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* the shell shown while the engine script downloads; src/ui/loading.ts replaces it */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 100;
        background: radial-gradient(120% 60% at 50% 30%, #3a2a1c 0%, #1b1f26 55%, #0b0e12 100%); color: #ffd9a8;
        font: 800 13px/1.4 "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; letter-spacing: .3em; text-transform: uppercase; }
      #boot .t { font-size: 50px; font-weight: 900; letter-spacing: .02em; color: #ff9a3c; transform: skewX(-7deg); text-shadow: 0 4px 0 #1c0f06, 0 0 28px #ff7a1a66; }
      #boot .bar { width: 200px; height: 6px; background: #07090c; margin: 18px auto 10px; overflow: hidden; border-radius: 3px; box-shadow: inset 0 1px 2px #000, 0 1px 0 #ffffff14; }
      #boot .bar i { display: block; height: 100%; width: 30%; border-radius: 3px; background: linear-gradient(180deg, #ffd49a, #ff9a3c 45%, #e06a1a); animation: boot-slide 1.1s ease-in-out infinite alternate; }
      @keyframes boot-slide { from { transform: translateX(-30%); } to { transform: translateX(260%); } }
      #boot .c { text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <div id="boot"><div class="c"><div class="t">CRATEFALL</div><div class="bar"><i></i></div><div>Loading the engine</div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
